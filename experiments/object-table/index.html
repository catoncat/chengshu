const sampleHTML=`<!doctype html><html><head><title>沿河走到天黑</title></head><body><nav>首页 · 订阅 · 返回顶部</nav><article><h1>沿河走到天黑</h1><h2>一条不赶时间的路</h2><p>离开车站以后，我们沿着河堤向西走。没有目的地，也没有打开地图。河边有几个人钓鱼，椅子背后搁着保温杯。远处的桥正在修，一段蓝色围挡把暮色切成两半。</p><p>路过旧书摊的时候，我买了一本没有封面的旅行笔记。第一页只写着一句话：有些地方，应该慢一点经过。</p><h2>光留下的颜色</h2><p>太阳落到屋顶以下，河水开始显出铜的颜色。对岸有人推开一扇窗，窗帘鼓了一下，又落回去。我们停下来，看了很久。</p><p>这一天没有发生值得专门记录的大事。只是走到天黑，顺手把那几种颜色带回了家。</p></article><aside>猜你喜欢 · 推广内容</aside><footer>订阅周刊</footer></body></html>`;

renderHand();$('#recipe-count').textContent=state.recipes.length;$('#table-counter').textContent=String(state.cards.length).padStart(2,'0')+' OBJECTS';$('#gesture-hint').hidden=state.discoveries.length>0;$('#top-note').textContent=noteText();buttons();highlight()}
function noteText(){if(!state.discoveries.length)return'把「净文」叠到文章上。';if(!state.discoveries.includes('bind'))return'文页准备好了。试试「装订」。';if(!state.discoveries.includes('tint'))return'色笺也能叠到书上。';return'拖入你的东西，接着组合。'}
function renderHand(){let all=Object.entries(definitions).map(([id,d])=>({id,...d}));if(armed?.recipe){let r=state.recipes.find(r=>r.id===armed.id);if(r)all.push({id:r.id,name:r.name,roman:'V',rule:r.ops.map(op=>definitions[op].name).join(' · '),art:'recipe',recipe:true})}let hand=$('#hand');hand.classList.toggle('has-recipe',all.length>4);hand.innerHTML='';all.forEach((d,i)=>{let mid=(all.length-1)/2,off=i-mid,b=document.createElement('button');b.className='card tool'+(d.recipe?' recipe':'');b.dataset.tool=d.id;b.style.setProperty('--hr',(off*(innerWidth<650?4:7))+'deg');b.style.setProperty('--hy',(Math.abs(off)*7)+'px');b.style.setProperty('--hz',20+i);b.setAttribute('aria-label',`${d.name}，${d.rule}。拖到素材上，或先点选素材再点这张牌。`);b.innerHTML=`<div class="inner"><div class="card-top"><span>${d.recipe?'我的配方':d.id==='file'?'去向':'手艺'}</span><span class="roman">${d.roman}</span></div><div class="art">${arts[d.art]}</div><div class="name">${esc(d.name)}</div><div class="under">${esc(d.rule)}</div><div class="tail"><span>可反复使用</span><span class="pip"></span></div></div>`;hand.append(b);wire(b,{type:'tool',id:d.id,recipe:!!d.recipe})})}
function card(id){return state.cards.find(c=>c.id===id)}

function wire(el,ref){el.addEventListener('pointerdown',e=>pointerDown(e,ref));el.addEventListener('dblclick',e=>{if(ref.type==='material'){deselect();inspect(ref.id)}});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(ref.type==='material'&&!selected&&!armed)inspect(ref.id);else choose(ref)}else if(e.key===' '){e.preventDefault();choose(ref)}else if(e.key==='Escape')deselect()});el.addEventListener('click',e=>{if(e.detail===0)choose(ref)})}
function choose(ref){if(busy)return;if(armed&&ref.type==='material'){let m=match(armed,ref);if(m){deselect();return perform(m)}return reject(ref,reason(armed,ref))}if(selected&&ref.type==='tool'){let m=match({type:'material',id:selected},ref);if(m){deselect();return perform(m)}return reject(ref,reason(ref,{type:'material',id:selected}))}if(selected&&ref.type==='material'&&selected!==ref.id){let m=match({type:'material',id:selected},ref);if(m){deselect();return perform(m)}}if(ref.type==='tool'){armed=armed?.id===ref.id?null:ref;selected=null}else{if(selected===ref.id){deselect();return inspect(ref.id)}selected=ref.id;armed=null}highlight()}

function pointerDown(e,ref){if(e.button!==0||busy||$('#modal').open)return;const el=e.currentTarget;const r=el.getBoundingClientRect();drag={ref,el,pointer:e.pointerId,sx:e.clientX,sy:e.clientY,lastX:e.clientX,lastY:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null,target:null};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',pointerMove);el.addEventListener('pointerup',pointerUp);el.addEventListener('pointercancel',pointerCancel)}

let speed=e.clientX-d.lastX;d.lastX=e.clientX;d.lastY=e.clientY;let x=e.clientX-d.dx,y=e.clientY-d.dy;d.ghost.style.transform=`translate(${x}px,${y}px) rotate(${Math.max(-9,Math.min(9,speed*.25))}deg) scale(1.035)`;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');$$('.hover-match').forEach(el=>el.classList.remove('hover-match'));d.target=null;let note=$('#drop-note');note.style.display='none';if(hit&&hit!==d.el){const ref=hit.dataset.id?{type:'material',id:hit.dataset.id}:{type:'tool',id:hit.dataset.tool,recipe:!definitions[hit.dataset.tool]};let m=match(d.ref,ref);d.target={ref,match:m};if(m){hit.classList.add('hover-match');let rr=hit.getBoundingClientRect(),tr=$('#table').getBoundingClientRect();note.textContent=m.label;note.style.left=(rr.left+rr.width/2-tr.left)+'px';note.style.top=(rr.top-tr.top-12)+'px';note.style.display='block'}}}

function say(text){const t=$('#toast');t.textContent=text;t.classList.add('visible');$('#announce').textContent=text;clearTimeout(say.timer);say.timer=setTimeout(()=>t.classList.remove('visible'),2900)}

$('#add').onclick=openAdd;$('#collection').onclick=openCollection;$('#undo').onclick=undo;$('#redo').onclick=redo;$('#tidy').onclick=()=>{if(!state.cards.length||busy)return;remember();let n=state.cards.length,cols=innerWidth<650?2:Math.min(5,Math.max(2,Math.ceil(Math.sqrt(n*1.8)))),rows=Math.ceil(n/cols);state.cards.forEach((c,i)=>{c.x=cols===1?.5:(i%cols)/(cols-1)*.84+.08;c.y=rows===1?.35:Math.floor(i/cols)/(rows-1)*.87+.04;c.rot=i%2?3:-3;c.z=++z});render();persist()};$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').classList.toggle('active',soundOn);$('#sound').setAttribute('aria-label',soundOn?'关闭声音':'开启声音');tone('make');say(soundOn?'声音已开启。':'声音已关闭。')};$('#help').onclick=()=>modal('桌边小记',`<p>把手艺牌叠到素材上。能接住的牌会亮起来，松手就做。</p><p>也可以先点素材，再点手艺。双击物件翻开；键盘空格选牌，Enter 翻开或组合，Esc 放下。</p><p>文页 + 文页 = 文集<br>色笺 + 书 = 新封面<br>物件 + 留档 = 下载文件</p><p>做好的东西可以收成配方，下次换一份素材再用。原件不消耗，桌面底部可以撤回。</p><p class="quiet">这是独立的交互实验，不是新版 Android App。仅处理本地文字、HTML 和图片，没有网页抓取、AI 服务、社区插件运行或阅读器交接。文本清理不是生产级正文提取。图片会缩小后保存到当前浏览器。浏览器拒绝存储时会明确提示。样例内容由本项目创作。</p>`);
$('#mobile-help').onclick=$('#help').onclick;
$('#table').addEventListener('pointerdown',e=>{if(!e.target.closest('.card'))deselect()});document.addEventListener('keydown',e=>{if($('#modal').open||['TEXTAREA','INPUT'].includes(e.target.tagName))return;if(e.key==='Escape'){cleanupDrag();deselect()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{cleanupDrag();render()},100)});
// Public test hooks expose the same real functions as pointer and keyboard actions. No simulated success path.
window.ObjectTable={getState:()=>structuredClone(state),match,perform,cleanHTML,colorsFrom,epub,validRecipe,importFile,undo,redo,inspect};
render();persist();

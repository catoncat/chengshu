name: android
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/test-archive.sh"
      - "scripts/java/**"
      - "scripts/chengshu-share.test.mjs"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/test-archive.sh"
      - "scripts/java/**"
      - "scripts/chengshu-share.test.mjs"
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: archive exact source
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/chengshu-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-source
          path: ${{ runner.temp }}/chengshu-source.tar.gz
          retention-days: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: archive and share regression proofs
        run: |
          bash scripts/test-archive.sh | tee "$RUNNER_TEMP/archive-proof.log"
          node --test scripts/chengshu-share.test.mjs | tee "$RUNNER_TEMP/share-proof.log"
      - run: gradle -p android testDebugUnitTest assembleDebug assemblePreview 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-preview-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - name: test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            ${{ runner.temp }}/archive-proof.log
            ${{ runner.temp }}/share-proof.log
            ${{ runner.temp }}/android-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: publish apk
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/chengshu.apk
          python3 - <<'PY'
          import json, re
          t = open("android/app/build.gradle.kts").read()
          code = int(re.search(r"versionCode = (\d+)", t).group(1))
          name = re.search(r'versionName = "([^"]+)"', t).group(1)
          json.dump(
              {"versionCode": code, "versionName": name, "apk": "https://0nl.onl/chengshu.apk"},
              open("public/app.json", "w"),
              ensure_ascii=False,
          )
          PY
          git config user.name "chengshu-bot"
          git config user.email "chengshu-bot@users.noreply.github.com"
          git add public/chengshu.apk public/app.json
          git diff --staged --quiet && echo "apk unchanged" && exit 0
          git commit -m "android: 发布 APK"
          git pull --rebase origin main
          git push origin HEAD:main

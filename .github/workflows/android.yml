name: android
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/test-archive.sh"
      - "scripts/java/**"
      - "scripts/chengshu-share.test.mjs"
      - "scripts/android-ci.sh"
      - "scripts/publish-manifest.mjs"
      - "scripts/publish-manifest.test.mjs"
      - "scripts/pipefail-guard.test.mjs"
      - "package.json"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/test-archive.sh"
      - "scripts/java/**"
      - "scripts/chengshu-share.test.mjs"
      - "scripts/android-ci.sh"
      - "scripts/publish-manifest.mjs"
      - "scripts/publish-manifest.test.mjs"
      - "scripts/pipefail-guard.test.mjs"
      - "package.json"
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: archive exact source
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/chengshu-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-source
          path: ${{ runner.temp }}/chengshu-source.tar.gz
          retention-days: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: proofs, unit tests and APKs
        run: bash scripts/android-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-preview-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - name: test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            ${{ runner.temp }}/chengshu-ci/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: publish apk
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p public/releases
          decided="$(node scripts/publish-manifest.mjs \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --version-file android/app/build.gradle.kts \
            --out public/app.json \
            --copy public/chengshu.apk \
            --release "public/releases/chengshu-$(python3 -c 'import re,sys; print(re.search(r"versionCode = (\d+)", open("android/app/build.gradle.kts").read()).group(1))').apk" \
            --commit "${GITHUB_SHA}" \
            --channel stable \
            --url https://0nl.onl/chengshu.apk)"
          echo "$decided"
          action="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["action"])' "$decided")"
          if [ "$action" != "publish" ]; then
            echo "manifest not updated: $action"
            exit 0
          fi
          git config user.name "chengshu-bot"
          git config user.email "chengshu-bot@users.noreply.github.com"
          git add public/chengshu.apk public/app.json public/releases
          git diff --staged --quiet && echo "apk unchanged" && exit 0
          git commit -m "android: 发布 APK ${GITHUB_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main

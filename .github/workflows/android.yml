name: android
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug
      - name: publish apk
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/chengshu.apk
          git config user.name "chengshu-bot"
          git config user.email "chengshu-bot@users.noreply.github.com"
          git add public/chengshu.apk
          git diff --staged --quiet && echo "apk unchanged" && exit 0
          git commit -m "android: 发布 APK"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: chengshu-apk
          path: public/chengshu.apk
